name: AURELIS Quality
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  submit:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/aurelis-quality
        with:
          api-url: ${{ secrets.AURELIS_API_URL }}
          html-path: index.html
          project-name: ${{ github.repository }} PR ${{ github.event.pull_request.number || 'manual' }}
