services:
  postgres:
    image: postgres:17-alpine
    container_name: aurelis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurelis
      POSTGRES_USER: aurelis
      POSTGRES_PASSWORD: aurelis_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelis -d aurelis"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aurelis_postgres_data:/var/lib/postgresql/data

  validator:
    image: ghcr.io/validator/validator:latest
    container_name: aurelis-validator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      CONNECTION_TIMEOUT_SECONDS: "15"
      SOCKET_TIMEOUT_SECONDS: "15"

volumes:
  aurelis_postgres_data:
